# Example gallery skeleton: how the docs group and order the examples.
# The example FILES live in each package's examples/ dir (kept in topic folders
# for browsing); THIS file is the source of truth for the gallery. A ref is
# "<package>: <name>" for an example in that section's folder, or
# "<package>: <path>" (path from <package>/examples/) to cross-list one from
# elsewhere. Examples present in a folder but not listed here sort to the end of
# their section.

tutorial:
  - "01_hello_world.py"
  - "02_tempo_change.py"
  - "03_blocking_false.py"
  - "04_play_chord.py"
  - "05_random_durations_and_rests.py"
  - "06_notation.py"
  - "07_time_signature.py"
  - "08_random_quantized.py"
  - "09_simplified_quantization.py"
  - "10_multi_part.py"
  - "11_nested_tempi"
  - "12_envelopes_basic.py"
  - "13_envelopes_advanced.py"
  - "14_gliss_from_envelope.py"
  - "15_envelope_shorthand.py"
  - "16_start_and_end_note.py"
  - "17_volume_envelope.py"
  - "18_microtonal.py"
  - "19_playback_implementations.py"
  - "20_note_properties.py"
  - "21_pitch_spelling.py"
  - "22_staff_text.py"
  - "23_special_notations.py"
  - "24_osc_to_supercollider"
  - "25_MIDI_in_out.py"
  - "26_keyboard_input.py"
  - "27_mouse_input.py"
  - "28_osc_listening"
  - "29_spanners.py"

topics:
  "Time & clocks":
    "Forking & simultaneity":
