# NOTE: THIS SOURCE FILE WAS GENERATED BY CLAUDE OPUS 4.8 WITH LITTLE HUMAN OVERSIGHT
# PLEASE REVIEW THE AI POLICY AT REPOSITORY ROOT FOR MORE INFORMATION
#
# Daily housekeeping: advance each submodule pointer to the latest commit on the
# branch it tracks (see .gitmodules), then commit and push. Keeps a fresh clone
# roughly current with no manual chore. The pointers are convenience, not
# reproducibility pins — each package tags its own releases.

name: Bump submodules

on:
  schedule:
    - cron: '17 6 * * *'   # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update submodules to their tracked branches
        run: git submodule update --remote

      - name: Commit and push if anything moved
        run: |
          if git diff --quiet; then
            echo "No submodule changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump submodules to latest"
          git push
